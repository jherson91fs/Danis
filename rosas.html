  <!-- Script de inicialización heredado -->
  <script>
    // Función main.js integrada
    window.addEventListener('load', () => {
      document.body.classList.remove("container");
      
      // Verificar soporte de características
      const features = {
        vibration: 'vibrate' in navigator,
        touchEvents: 'ontouchstart' in window,
        orientationAPI: 'orientation' in window || 'onorientationchange' in window,
        devicePixelRatio: window.devicePixelRatio || 1
      };
      
      console.log('Características del dispositivo:', features);
      
      // Optimización para pantallas de alta densidad
      if (features.devicePixelRatio > 2) {
        document.body.classList.add('high-dpi');
      }
      
      // Detección de dispositivo táctil
      if (features.touchEvents) {
        document.body.classList.add('touch-device');
      }
      
      // Mensaje de bienvenida para desarrolladores
      console.log(`
🌻 Jardín Interactivo de Flores Cargado
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
✓ Interactividad táctil activada
✓ Orientación adaptativa habilitada  
✓ Gestos naturales detectados
✓ Sistema de descubrimiento iniciado
${features.vibration ? '✓' : '✗'} Feedback háptico ${features.vibration ? 'disponible' : 'no disponible'}

Toca las flores para descubrir secretos ocultos...
      `);
    });

    // Prevenir comportamientos por defecto en móviles
    document.addEventListener('touchstart', function(e) {
      // Permitir gestos en elementos específicos
      if (!e.target.closest('.flower, .control-btn, input[type="range"]')) {
        // No prevenir otros gestos importantes
      }
    }, { passive: true });

    // Manejo de errores globales
    window.addEventListener('error', (e) => {
      console.error('Error en el jardín interactivo:', e.error);
      
      // Fallback graceful
      if (e.error && e.error.message.includes('vibrate')) {
        console.log('Vibraciones deshabilitadas por compatibilidad');
      }
    });

    // Detección de modo offline
    window.addEventListener('online', () => {
      console.log('Conectividad restaurada');
    });

    window.addEventListener('offline', () => {
      console.log('Modo offline - funcionalidad limitada');
    });
  </script>
